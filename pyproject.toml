[build-system]
requires = ["setuptools>=77,<82"]
build-backend = "setuptools.build_meta"

[project]
name = "yttext"
version = "0.5.4"
description = "CLI and web app for extracting YouTube transcripts"
readme = "README.md"
authors = [{ name = "Kensuke Kamisoyama" }]
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11,<3.15"
keywords = ["youtube", "captions", "transcript", "cli", "gemini"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Framework :: FastAPI",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Multimedia :: Video",
]
dependencies = [
    "yt-dlp>=2026.7.4",
]

[project.optional-dependencies]
web = [
    "fastapi>=0.116,<1",
    "uvicorn>=0.35,<1",
]
dev = [
    "httpx2>=2,<3",
    "packaging>=25,<27",
    "pytest>=8.4,<10",
    "ruff>=0.12,<1",
]

[project.scripts]
yttext = "yttext.cli:main"

[project.urls]
Homepage = "https://github.com/kkensuke/yttext"
Repository = "https://github.com/kkensuke/yttext"
Issues = "https://github.com/kkensuke/yttext/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"yttext.ui" = ["*.html", "*.css", "*.js", "*.txt", "*.woff2"]

[tool.pytest.ini_options]
addopts = "-q"
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
